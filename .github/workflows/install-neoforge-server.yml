name: Sunucuya NeoForge Server Jar Kur

# Elle tetiklenir; bootstrap-vps.yml calistiktan SONRA, bir kez calistirilir.
# Resmi NeoForge installer'ini indirip "--installServer" ile calistirir ve
# sonucu VPS'teki VPS_SERVER_DIR (orn. /opt/pokewing-mc/neoforge) icine gonderir.
#
# neoforge_version varsayilani serverMod/gradle.properties icindeki
# neoforge_version ile ayni tutulmalidir (NeoForge surum numaralari Minecraft
# surumunu de icinde barindirir, orn. 1.20.1 -> 20.1.x).
on:
  workflow_dispatch:
    inputs:
      neoforge_version:
        description: "NeoForge surumu (orn. 20.1.115)"
        required: true
        default: "20.1.115"

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::VPS_HOST/VPS_SSH_KEY secret'lari eksik. Once bootstrap-vps.yml'yi calistirip deploy anahtarini ekleyin."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download NeoForge installer
        run: |
          curl -sSL -o neoforge-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/${{ inputs.neoforge_version }}/neoforge-${{ inputs.neoforge_version }}-installer.jar"

      - name: Run installer (server mode)
        run: |
          mkdir -p server_output
          java -jar neoforge-installer.jar --installServer server_output
          echo "eula=true" > server_output/eula.txt
          ls -la server_output

      - name: Upload server files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "server_output/*"
          target: "${{ secrets.VPS_SERVER_DIR }}"
          strip_components: 1

      - name: (Yeniden) başlat
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            sudo systemctl start pokewing-mc@${{ secrets.VPS_LOADER }} || true
            sleep 5
            sudo systemctl is-active pokewing-mc@${{ secrets.VPS_LOADER }}
