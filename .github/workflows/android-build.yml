name: Android APK Build

# Telefondan push attiginda bulutta APK derlenip GitHub Releases'e
# eklenir; bilgisayar veya Android Studio'ya ihtiyac duymadan
# yayinlama (publish) yapabilmeni saglar.
on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokewing-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "apk-build-${{ github.run_number }}"
          name: "APK derlemesi #${{ github.run_number }} (${{ github.ref_name }})"
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
